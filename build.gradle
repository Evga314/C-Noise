plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "cnoise" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Keep Minecraft differential tests separate from production and standalone FFM tests.
sourceSets {
    perlinTest {
        java {
            srcDir 'tests/integration'
            include 'PerlinMinecraftTest.java'
            include 'BlendedMinecraftTest.java'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

def perlinJvmModes = [
        interpreted: ['-Xint'],
        default: [],
        c2: ['-Xbatch', '-XX:-TieredCompilation']
]
def perlinVerification = tasks.register('verifyPerlin') {
    group = 'verification'
    description = 'Compare native Perlin with Minecraft in three JVM modes.'
}
perlinJvmModes.each { mode, vmOptions ->
    def verificationTask = tasks.register("verifyPerlin_${mode}", JavaExec) {
        group = 'verification'
        dependsOn tasks.named('perlinTestClasses')
        classpath = sourceSets.perlinTest.runtimeClasspath
        mainClass = 'PerlinMinecraftTest'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
        jvmArgs(['--enable-native-access=ALL-UNNAMED'] + vmOptions)
        doFirst {
            def libraryPath = providers.gradleProperty('perlinTestLibrary').orNull
            if (libraryPath == null || !file(libraryPath).isFile()) {
                throw new GradleException(
                        'Build cnoise_perlin_test_bridge first and pass -PperlinTestLibrary=<library path>')
            }
            setArgs([file(libraryPath).absolutePath])
        }
    }
    perlinVerification.configure {
        dependsOn verificationTask
    }
}

def blendedVerification = tasks.register('verifyBlended') {
    group = 'verification'
    description = 'Compare native SmearedPerlin and BlendedNoise with Minecraft in three JVM modes.'
}
perlinJvmModes.each { mode, vmOptions ->
    def verificationTask = tasks.register("verifyBlended_${mode}", JavaExec) {
        group = 'verification'
        dependsOn tasks.named('perlinTestClasses')
        classpath = sourceSets.perlinTest.runtimeClasspath
        mainClass = 'BlendedMinecraftTest'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
        jvmArgs(['--enable-native-access=ALL-UNNAMED'] + vmOptions)
        doFirst {
            def libraryPath = providers.gradleProperty('perlinTestLibrary').orNull
            if (libraryPath == null || !file(libraryPath).isFile()) {
                throw new GradleException(
                        'Build cnoise_perlin_test_bridge first and pass -PperlinTestLibrary=<library path>')
            }
            setArgs([file(libraryPath).absolutePath])
        }
    }
    blendedVerification.configure {
        dependsOn verificationTask
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
